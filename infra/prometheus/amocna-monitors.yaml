apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sock-shop-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchExpressions:
      - key: name
        operator: Exists
  namespaceSelector:
    matchNames:
      - sock-shop
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: name
      metricRelabelings:
        - sourceLabels: [service]
          targetLabel: name
    - port: front-end
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: name
      metricRelabelings:
        - sourceLabels: [service]
          targetLabel: name
    - port: exporter
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: name
      metricRelabelings:
        - sourceLabels: [service]
          targetLabel: name
    - port: prometheus
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: name
      metricRelabelings:
        - sourceLabels: [service]
          targetLabel: name
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      name: rabbitmq
  namespaceSelector:
    matchNames:
      - rabbitmq
  endpoints:
    - port: prometheus
      path: /metrics/per-object
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metis-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: metis
  namespaceSelector:
    matchNames:
      - metis
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
---
