apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 01-rbac.yaml
  - 02-cronjob.yaml

configMapGenerator:
  - name: scig-scripts
    namespace: amocna-scig
    files:
      - scan.sh
  - name: scig-images
    namespace: amocna-scig
    files:
      - images.txt

generatorOptions:
  disableNameSuffixHash: true
