# Scenario 7 — Registry Credential Remediation benchmark workloads.
# Placeholder {private_image} is substituted by amocna benchmark run --scenario 7.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s6-sibling-sa
  namespace: sock-shop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s6-failing-sa
  namespace: sock-shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s6-sibling
  namespace: sock-shop
  labels:
    app: s6-sibling
spec:
  replicas: 0
  selector:
    matchLabels:
      app: s6-sibling
  template:
    metadata:
      labels:
        app: s6-sibling
    spec:
      serviceAccountName: s6-sibling-sa
      imagePullSecrets:
        - name: regcred
      containers:
        - name: app
          image: {private_image}
          imagePullPolicy: Always
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s6-failing
  namespace: sock-shop
  labels:
    app: s6-failing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s6-failing
  template:
    metadata:
      labels:
        app: s6-failing
    spec:
      serviceAccountName: s6-failing-sa
      containers:
        - name: app
          image: {private_image}
          imagePullPolicy: Always
          command: ["sleep", "infinity"]
